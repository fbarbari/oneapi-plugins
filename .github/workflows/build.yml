name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Highest glibc the production machine provides; the build fails if libs need more.
  MAX_GLIBC: "2.27"
  BASE_IMAGE: "ubuntu:18.04"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - ONEAPI_VERSION: "2025.2"
            SYCL_VERSION: "6.2.1"
          - ONEAPI_VERSION: "2025.3"
            SYCL_VERSION: "6.3.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build toolchain image
        run: |
          docker build -f Dockerfile.build --build-arg BASE_IMAGE=${BASE_IMAGE} -t ur-builder .

      - name: Build
        # The sed command is an hacky workaround but gets the job done for now
        run: |
          sed -i 's/^COMPILER_VERSION="2025\.3"$/COMPILER_VERSION="${{ matrix.ONEAPI_VERSION }}"/' ./oneapi-ur-adapter.stub.sh
          docker run --rm -v "$PWD:/src" ur-builder \
            python3 build_adapter.py \
              --cuda \
              --branch v${{ matrix.SYCL_VERSION }} \
              --oneapi-version ${{ matrix.ONEAPI_VERSION }} \
              --stub ./oneapi-ur-adapter.stub.sh \
              -j$(nproc)

      - name: Check glibc requirements
        run: |
          docker run --rm -v "$PWD:/src" ur-builder \
            ./check_glibc.sh work_ur_build/ur-install/lib "${MAX_GLIBC}"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: oneapi-ur-cuda-linux-x86_64-${{ matrix.ONEAPI_VERSION }}.sh
          path: work_ur_build/out/

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: collected-artifacts

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
          files: collected-artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
